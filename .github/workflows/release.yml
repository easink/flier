name: Build precompiled NIFs

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create_release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes || true

  build_release:
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }}
    needs: create_release
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        nif: ["2.16", "2.17"]
        job:
          - target: x86_64-unknown-linux-gnu
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            use_cross: true
          - target: arm-unknown-linux-gnueabihf
            use_cross: true
          - target: riscv64gc-unknown-linux-gnu
            use_cross: true

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Install cross
        if: ${{ matrix.job.use_cross }}
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ matrix.job.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.job.target }}-

      - name: Build NIFs
        run: |
          NIF_FEATURE="nif_version_$(echo "${{ matrix.nif }}" | tr '.' '_')"
          BUILD_CMD="${{ matrix.job.use_cross == true && 'cross' || 'cargo' }}"
          for CRATE in flier_inotify flier_entries; do
            $BUILD_CMD build --release \
              --target ${{ matrix.job.target }} \
              --manifest-path native/${CRATE}/Cargo.toml \
              --features "${NIF_FEATURE}"
          done

      - name: Package artifacts
        env:
          TARGET: ${{ matrix.job.target }}
          VERSION: ${{ steps.version.outputs.version }}
          NIF_VERSION: ${{ matrix.nif }}
        run: |
          for CRATE in flier_inotify flier_entries; do
            SO="target/${TARGET}/release/lib${CRATE}.so"
            LIB_NAME="lib${CRATE}-v${VERSION}-nif-${NIF_VERSION}-${TARGET}.so"
            ARCHIVE="${LIB_NAME}.tar.gz"
            cp "${SO}" "${LIB_NAME}"
            tar -czf "${ARCHIVE}" "${LIB_NAME}"
            rm "${LIB_NAME}"
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256sum"
          done

      - name: Upload artifacts to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NIF_VERSION: ${{ matrix.nif }}
          TARGET: ${{ matrix.job.target }}
        run: |
          for CRATE in flier_inotify flier_entries; do
            FILE="lib${CRATE}-v${VERSION}-nif-${NIF_VERSION}-${TARGET}.so.tar.gz"
            gh release upload "${GITHUB_REF_NAME}" "${FILE}" --clobber
          done
